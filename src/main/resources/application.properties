spring.application.name=covid19stats
spring.datasource.url=jdbc:mysql://localhost:3306/covid_statistics?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
covid19stats.default-iso=CHN
covid.report.date=2022-03-15

spring.mvc.format.date=yyyy-MM-dd
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC


logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n


logging.level.com.covid.covid19stats.config.AutomaticThread=INFO
logging.level.com.covid.covid19stats.service.ReportService=INFO
logging.level.com.covid.covid19stats.service.RegionService=WARN
logging.level.com.covid.covid19stats.service.ProvinceService=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN